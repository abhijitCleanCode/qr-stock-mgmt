function invoiceDocHtml(inv){
  var t = X.invoiceTotals(inv), p = inv.party;
  var order = X.orderByNo(inv.orderNo);
  var wanted = {}; if (order) order.items.forEach(function(i){ wanted[key(i.design,i.variant)] = i.qty; });
  var groups = [], seen = {};
  t.lines.forEach(function(l){ if (!seen[l.design]){ seen[l.design] = []; groups.push(l.design); } seen[l.design].push(l); });
  var body = groups.map(function(d){
    return '<tr class="dg"><td colspan="6">'+esc(d)+' &middot; '+esc(DESIGNS[d].name)+'</td></tr>'+
      seen[d].map(function(l){
        var sizes = DESIGNS[d].sizes.filter(function(s){ return l.sizes[s]; }).map(function(s){ return s+":"+l.sizes[s]; }).join("  ");
        var comp = [l.sets?l.sets+" set"+(l.sets>1?"s":""):"", l.semis?l.semis+" semi":"", l.singles?l.singles+" pc"+(l.singles>1?"s":""):""].filter(Boolean).join(" + ");
        return '<tr><td><b>'+esc(vName(d,l.variant))+'</b>'+(wanted[key(d,l.variant)]===undefined?' <span style="font-size:9.5px;color:#6D28D9;font-weight:700;">EXTRA</span>':'')+'</td>'+
          '<td style="font-size:11px;color:#475569;">'+comp+'</td><td class="mono" style="font-size:11px;">'+sizes+'</td>'+
          '<td class="n">'+l.pcs+'</td><td class="n">'+inr(l.rate)+'</td><td class="n"><b>'+inr(l.amount)+'</b></td></tr>';
      }).join("");
  }).join("");
  return '<div class="doc"><div class="dh"><div><div class="dt">Invoice</div><div class="ds">Goods dispatched against order form '+esc(inv.orderNo)+'</div></div>'+
    '<div class="dno"><div class="k">Invoice no.</div><div class="v">'+esc(inv.no)+'</div></div></div>'+
    '<div class="dmeta">'+metaCell("Billed to", esc(p.name))+metaCell("Invoice date", esc(X.longDate(inv.date)))+metaCell("Order form", esc(inv.orderNo))+
      metaCell("Mobile", esc(p.mobile||"\u2014"))+metaCell("City", esc(p.city||"\u2014"))+metaCell("GST No.", esc(p.gst||"\u2014"))+
      metaCell("Transport", esc(p.transport||"\u2014"))+metaCell("Agent", esc(p.agent||"\u2014"))+metaCell("Prepared by", esc(inv.by)+(inv.editedBy?" \u00b7 edited by "+esc(inv.editedBy):""))+'</div>'+
    '<table class="dtbl"><thead><tr><th>Variant</th><th>Packed as</th><th>Sizes</th><th class="n">Pcs</th><th class="n">Rate / pc</th><th class="n">Amount</th></tr></thead><tbody>'+body+
    '<tr class="tot"><td colspan="3">Total</td><td class="n">'+t.pcs+'</td><td></td><td class="n">'+inr(t.amount)+'</td></tr></tbody></table>'+
    '<div class="dsign"><div>Packed by</div><div>Checked by</div><div>Receiver&rsquo;s signature</div></div>'+
    '<div class="dfoot"><span>'+esc(inv.no)+' &middot; '+esc(inv.orderNo)+'</span><span>Printed '+X.longDate(X.todayStr())+'</span></div></div>';
}

function orderCSV(o){

    ["GST No.", o.party.gst],["Transport", o.party.transport],["Agent", o.party.agent],[],["Design","Design name","Variant","Code","Required pcs"]];
  o.items.forEach(function(i){ rows.push([i.design, DESIGNS[i.design].name, vName(i.design,i.variant), i.design+"-"+i.variant, i.qty]); });

function invoiceCSV(inv){

  var rows = [["Invoice no.", inv.no],["Date", inv.date],["Order form", inv.orderNo],["Party", inv.party.name],["Mobile", inv.party.mobile],

  rows.push([],["Total","","","","",t.pcs,"",t.amount],[],["Scanned tags"],["Tag ID","Type","Design","Variant","Pieces","Method"]);
  inv.entries.forEach(function(e){ rows.push([e.scanId, X.kindLabel(e.kind), e.design, vName(e.design,e.variant), e.pieces.length, e.method]); });

   INVOICE — CREATE / EDIT (the only step that changes stock)

function viewInvoiceEdit(editNo, presetOrder){
  var editing = editNo ? X.invoiceByNo(editNo) : null;
  if (editing && !isOwner()){ toast("Only the owner can edit invoices."); return go("invoiceView", {no:editNo}); }

  var st = { order:null, ticks:{}, cart:[] };
  var inCart = {};            // pieceId -> true
  var restorePieces = null;   // for edit mode: pieces to re-mark as sold if the user leaves without saving

  if (editing){
    st.order = X.orderByNo(editing.orderNo);
    st.ticks = JSON.parse(JSON.stringify(editing.ticks || {}));
    st.cart = editing.entries.map(function(e){ return {scanId:e.scanId, kind:e.kind, design:e.design, variant:e.variant, pieces:e.pieces.slice(), method:e.method, time:e.time}; });
    restorePieces = [];
    st.cart.forEach(function(e){ e.pieces.forEach(function(pid){ PIECES[pid].sold = null; inCart[pid] = true; restorePieces.push(pid); }); });
    leaveHook = function(){ restorePieces.forEach(function(pid){ PIECES[pid].sold = editing.no; }); };
  }

  $("#app").innerHTML = subnav() +
    '<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;">'+
      '<div><button class="fclear" id="iBack" style="padding-left:0;">'+icon("back",13,2)+' Invoices</button>'+
      '<h1>'+(editing ? "Edit Invoice" : "New Invoice")+'</h1>'+
      '<p class="sub">Fetch the order form as your checklist, then scan every set, semi set or piece you pick. Stock is deducted only when you generate the invoice.</p></div>'+
      '<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">'+
        '<div class="field" style="width:240px;"><label>Invoice no. <span class="req">*</span></label>'+
          '<div class="numbox"><input class="inp" id="iNo" autocomplete="off" placeholder="e.g. INV-2026-042"><button class="btn sm" id="iSug">Next no.</button></div>'+
          '<div class="hint" id="iNoH"></div></div>'+
        '<div class="field" style="width:140px;"><label>Date</label><input class="inp mono" id="iDate"></div>'+
      '</div></div>'+
      '<div class="field acwrap" style="max-width:520px;margin-top:6px;"><label>Order form no. <span class="req">*</span></label>'+
        '<div class="numbox"><input class="inp" id="iOrd" autocomplete="off" placeholder="Type the order form number to fetch it"'+(editing?" disabled":"")+'>'+
        '<button class="btn dark sm" id="iFetch"'+(editing?" disabled":"")+'>Fetch</button></div>'+
        '<div class="acdd" id="iOrdDD"></div><div class="hint" id="iOrdH"></div></div>'+
    '</div>'+
    '<div id="iBody"></div>';

  $("#iNo").value = editing ? editing.no : "";
  $("#iDate").value = editing ? editing.date : X.todayStr();
  var checkNo = X.wireUniqueField("#iNo", "#iNoH", X.invoiceByNo, editing && editing.no, "invoice number");
  $("#iSug").onclick = function(){ $("#iNo").value = X.suggestNext(INVOICES, "INV-2026-"); $("#iNo").dispatchEvent(new Event("input")); };
  $("#iBack").onclick = function(){ go(editing ? "invoiceView" : "invoices", editing ? {no:editing.no} : null); };

  /* ---- order number fetch with suggestions ---- */
  var ordInp = $("#iOrd");
  function ordDD(show){
    var box = $("#iOrdDD"); if (!box) return; if (!show){ box.classList.remove("on"); return; }
    var q = norm(ordInp.value);
    var list = ORDERS.filter(function(o){ return o.status==="open" && (!q || o.no.indexOf(q) >= 0 || norm(o.party.name).indexOf(q) >= 0); }).slice(0, 6);
    if (!list.length){ box.classList.remove("on"); return; }
    box.innerHTML = list.map(function(o){ return '<div class="acitem" data-ord="'+esc(o.no)+'"><div><div class="n mono">'+esc(o.no)+'</div><div class="m">'+esc(o.party.name)+' &middot; '+X.orderPcs(o)+' pcs</div></div><div class="m">'+esc(o.date)+'</div></div>'; }).join("");
    box.classList.add("on");
    $all("[data-ord]", box).forEach(function(el){ el.onmousedown = function(e){ e.preventDefault(); ordInp.value = el.dataset.ord; ordDD(false); fetchOrder(); }; });
  }
  var ordBlurT = null;
  ordInp.addEventListener("input", function(){ clearTimeout(ordBlurT); ordDD(true); });
  ordInp.addEventListener("focus", function(){ clearTimeout(ordBlurT); ordDD(true); });
  ordInp.addEventListener("blur", function(){ ordBlurT = setTimeout(function(){ ordDD(false); }, 120); });
  ordInp.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); ordDD(false); fetchOrder(); } });
  $("#iFetch").onclick = fetchOrder;

  function fetchOrder(){
    var no = norm(ordInp.value), h = $("#iOrdH");
    var o = X.orderByNo(no);
    if (!o){ h.className = "hint bad"; h.innerHTML = icon("alert",12,2.2)+" No order form "+esc(no||"")+" found."; return; }
    if (o.status !== "open"){ h.className = "hint bad"; h.innerHTML = icon("alert",12,2.2)+" "+esc(o.no)+" is already invoiced as "+esc(o.invoiceNo)+"."; return; }
    if (st.cart.length && st.order && st.order.no !== o.no){
      modal("Switch order form?", "You&rsquo;ve already scanned <b>"+sum(st.cart,function(e){return e.pieces.length;})+" pcs</b> for "+esc(st.order.no)+". Switching keeps those scans but changes the checklist and party.",
        [{label:"Cancel"},{label:"Switch", kind:"pri", fn:function(){ load(o); }}]); return;
    }
    load(o);
  }
  function load(o){
    st.order = o; if (!editing) st.ticks = {};
    ordInp.value = o.no;
    var h = $("#iOrdH"); h.className = "hint ok"; h.innerHTML = icon("check",12,2.6)+" Fetched "+esc(o.no)+" &middot; "+esc(o.party.name)+" &middot; "+X.orderPcs(o)+" pcs requested";
    body();
  }

  var party = null, scan = null;
  function body(){
    if (!st.order){
      $("#iBody").innerHTML = '<div class="sheet"><div class="empty"><b>Fetch an order form to begin</b>The order form becomes your picking checklist &mdash; you can still add designs that aren&rsquo;t on it.</div></div>';
      return;
    }
    $("#iBody").innerHTML =
      '<div class="sheet">'+X.partyBlockHtml("ip")+'</div>'+
      '<div class="split">'+
        '<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;">'+
          '<div><h2>Checklist &middot; '+esc(st.order.no)+'</h2><p class="small-sub">Tick each line as you find it in the godown. Demand vs available updates as you scan.</p></div>'+
          '<span class="small-sub" id="ckSum"></span></div><div id="ckList"></div></div>'+
        '<div class="sheet"><div id="iScan"></div></div>'+
      '</div>'+
      '<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap;">'+
        '<div><h2>Picked for this invoice</h2><p class="small-sub">Every scanned tag, grouped by design and variant. Remove a tag if it was scanned by mistake.</p></div></div>'+
        '<div id="picked"></div></div>'+
      '<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">'+
        '<div class="sumbar" id="iTotals"></div>'+
        '<div style="display:flex;gap:10px;"><button class="btn" id="iCancel">Cancel</button>'+
        '<button class="btn pri" id="iGen">'+icon("check",15,2.4)+(editing?"Save invoice changes":"Generate Invoice")+'</button></div></div></div>';

    party = X.PartyCtl("ip", editing ? {party:editing.party, partyId:editing.partyId} : {party:st.order.party, partyId:st.order.partyId});
    scan = X.ScanPanel($("#iScan"), {
      pfx:"is", title:"Scan picked stock", manualPh:"Set ID or piece ID, e.g. SET-KP100-MID-003",
      hint:"Parent = whole set, semi-set QR = its pieces, child or loose = 1 piece. Counted automatically.",
      onCode:onScan, demoTags:demoTags
    });
    $("#iCancel").onclick = function(){ go(editing ? "invoiceView" : "invoices", editing ? {no:editing.no} : null); };
    $("#iGen").onclick = generate;
    refresh();
  }

  function demoTags(){
    var wanted = st.order ? st.order.items.map(function(i){ return key(i.design,i.variant); }) : [];
    var out = [], seenK = {};
    function push(id, k){ if (out.length < 9 && !out.some(function(x){ return x.id===id; })) out.push({id:id, k:k}); }
    // one parent, one loose/child per wanted variant, then a couple of extras
    wanted.concat(Object.keys(DESIGNS).reduce(function(a, d){ return a.concat(Object.keys(DESIGNS[d].variants).map(function(v){ return key(d,v); })); }, []))
    .forEach(function(k){
      if (seenK[k]) return; seenK[k] = 1; var kv = X.unkey(k);
      var u = Object.keys(UNITS).filter(function(id){ var x = UNITS[id]; return x.design===kv.design && x.variant===kv.variant &&
        x.pieces.every(function(p){ return !PIECES[p].sold && !inCart[p]; }); })[0];
      if (u) push(u, UNITS[u].kind==="set" ? "PARENT" : "SEMI");
      var lp = Object.keys(PIECES).filter(function(id){ var p = PIECES[id]; return p.design===kv.design && p.variant===kv.variant && !p.parent && !p.sold && !inCart[id]; })[0];
      if (lp) push(lp, "LOOSE");
    });
    return out;
  }

  function onScan(raw, method){
    var r = X.resolveCode(raw);
    if (!r){ return scan.feedback("bad", "<b>"+esc(raw)+"</b> isn&rsquo;t a known QR tag."); }
    if (r.kind==="design" || r.kind==="variant"){ return scan.feedback("bad", "<b>"+esc(raw)+"</b> is a design code. At dispatch, scan or type the actual tag ID on the set or piece so the exact stock is deducted."); }
    var soldTo = r.pieces.map(function(p){ return PIECES[p].sold; }).filter(Boolean);
    var already = r.pieces.filter(function(p){ return inCart[p]; });
    if (r.kind==="set" || r.kind==="semi"){
      if (already.length === r.pieces.length) return scan.feedback("warn", "<b>"+esc(r.id)+"</b> is already on this invoice.");
      if (soldTo.length || already.length){
        var out = soldTo.length + already.length;
        return scan.feedback("bad", "<b>"+esc(r.id)+"</b> has been opened &mdash; "+out+" of "+r.pieces.length+" pieces are already "+(soldTo.length?"sold":"scanned")+". Scan the remaining pieces individually.");
      }
    } else {
      if (already.length) return scan.feedback("warn", "<b>"+esc(r.id)+"</b> is already on this invoice.");
      if (soldTo.length) return scan.feedback("bad", "<b>"+esc(r.id)+"</b> was already sold on "+esc(soldTo[0])+".");
      if (r.kind==="child"){
        var parentInCart = st.cart.filter(function(e){ return e.pieces.indexOf(r.id) >= 0; })[0];
        if (parentInCart) return scan.feedback("warn", "This piece is already counted through its set <b>"+esc(parentInCart.scanId)+"</b>.");
      }
    }
    var entry = {scanId:r.id, kind:r.kind, design:r.design, variant:r.variant, pieces:r.pieces.slice(), method:method, time:X.nowTime()};
    st.cart.push(entry); entry.pieces.forEach(function(p){ inCart[p] = true; });
    var inOrder = st.order.items.some(function(i){ return i.design===r.design && i.variant===r.variant; });
    var sizes = entry.pieces.map(function(p){ return PIECES[p].size; }).join(" \u00b7 ");
    scan.feedback(inOrder ? "ok" : "warn", "<b>+"+entry.pieces.length+" pc"+(entry.pieces.length>1?"s":"")+"</b> &middot; "+esc(X.kindLabel(r.kind))+" "+esc(r.id)+" ("+sizes+") added to <b>"+esc(r.design)+" "+esc(vName(r.design,r.variant))+"</b>"+
      (inOrder ? "." : " &mdash; <b>not on the order form</b>, added as an extra."));
    refresh(); scan.refreshDemo(); scan.focus();
  }

  function gathered(d, v){ return sum(st.cart.filter(function(e){ return e.design===d && e.variant===v; }), function(e){ return e.pieces.length; }); }

  function refresh(){
    /* checklist */
    var cols = "grid-template-columns:32px 1.7fr .7fr .8fr .8fr 1.2fr;";
    var ticked = 0;
    $("#ckList").innerHTML = '<div class="gt"><div class="gh" style="'+cols+'"><span></span><span>Design &middot; variant</span><span>Demand</span><span>Available</span><span>Picked</span><span>Status</span></div>'+
      st.order.items.map(function(i){
        var k = key(i.design, i.variant), g = gathered(i.design, i.variant), av = X.availablePcs(i.design, i.variant, inCart);
        var on = !!st.ticks[k]; if (on) ticked++;
        var need = i.qty - g, pill;
        if (g >= i.qty) pill = '<span class="pill ok">'+(g>i.qty?"Picked "+(g-i.qty)+" extra":"Complete")+'</span>';
        else if (av < need) pill = av===0 && g===0 ? '<span class="pill red">Out of stock</span>' : '<span class="pill red">Stock short by '+(need-av)+'</span>';
        else pill = '<span class="pill warn">'+need+' more to pick</span>';
        return '<div class="gr'+(on?" ticked":"")+'" style="'+cols+'"><button class="cb'+(on?" on":"")+'" data-tk="'+k+'" aria-label="Tick">'+icon("check",12,3)+'</button>'+
          '<div style="display:flex;align-items:center;gap:9px;"><span class="dot" style="background:'+vHex(i.design,i.variant)+'"></span><div><b>'+esc(i.design)+'</b> '+esc(vName(i.design,i.variant))+'</div></div>'+
          '<span class="num">'+i.qty+'</span><span class="num">'+av+'</span><span class="num" style="font-weight:700;color:'+(g?"var(--ink)":"var(--faint)")+';">'+g+'</span><span>'+pill+'</span></div>';
      }).join("")+'</div>';
    $("#ckSum").innerHTML = '<b>'+ticked+'</b> of '+st.order.items.length+' ticked';
    $all("[data-tk]", $("#ckList")).forEach(function(b){ b.onclick = function(){ st.ticks[b.dataset.tk] = !st.ticks[b.dataset.tk]; refresh(); }; });

    /* picked list */
    var lines = X.aggregate(st.cart);
    $("#picked").innerHTML = lines.map(function(l){
      var inOrder = st.order.items.some(function(i){ return i.design===l.design && i.variant===l.variant; });
      var ents = st.cart.filter(function(e){ return e.design===l.design && e.variant===l.variant; });
      return '<div class="ggroup"><div class="gg"><div style="display:flex;align-items:center;gap:9px;"><span class="dot" style="background:'+vHex(l.design,l.variant)+';width:10px;height:10px;"></span>'+
        '<b>'+esc(l.design)+' &middot; '+esc(vName(l.design,l.variant))+'</b>'+(inOrder?'':' <span class="extra">NOT ON ORDER FORM</span>')+'</div>'+
        '<span class="mono" style="font-weight:700;">'+l.pcs+' pcs</span></div>'+
        ents.map(function(e){ var sizes = e.pieces.map(function(p){ return PIECES[p].size; }).join(" ");
          return '<div class="ge"><span class="mono" style="font-weight:600;">'+esc(e.scanId)+'</span>'+
            '<span><span class="kind '+e.kind+'">'+esc(X.kindLabel(e.kind).toUpperCase())+'</span> <span class="mono" style="font-size:11px;color:var(--mut);">'+sizes+'</span></span>'+
            '<span class="num">'+e.pieces.length+' pc'+(e.pieces.length>1?"s":"")+'</span><span style="font-size:11.3px;color:var(--faint);">'+esc(e.method)+'</span>'+
            '<button class="x" data-rm="'+esc(e.scanId)+'" title="Remove">'+icon("x",12,2.2)+'</button></div>'; }).join("")+'</div>';
    }).join("") || '<div class="empty" style="border:1px dashed var(--line-2);border-radius:13px;"><b>Nothing picked yet</b>Scan the first set or piece you pick from the godown.</div>';
    $all("[data-rm]", $("#picked")).forEach(function(b){ b.onclick = function(){
      var ix = st.cart.findIndex(function(e){ return e.scanId===b.dataset.rm; }); if (ix < 0) return;
      st.cart[ix].pieces.forEach(function(p){ delete inCart[p]; }); st.cart.splice(ix, 1);
      refresh(); scan.refreshDemo(); scan.feedback("warn", "Removed <b>"+esc(b.dataset.rm)+"</b> from this invoice."); }; });

    /* totals */
    var pcs = sum(lines, function(l){ return l.pcs; }), amt = sum(lines, function(l){ return l.amount; });
    $("#iTotals").innerHTML = '<div class="s"><div class="v">'+lines.length+'</div><div class="l">Variants</div></div>'+
      '<div class="s"><div class="v">'+st.cart.length+'</div><div class="l">Tags scanned</div></div>'+
      '<div class="s"><div class="v">'+pcs+'</div><div class="l">Pieces</div></div>'+
      '<div class="s"><div class="v" style="color:var(--g);">'+inr(amt)+'</div><div class="l">Invoice value</div></div>';
  }

  function generate(){
    if (!checkNo()){ toast("Enter a unique invoice number."); $("#iNo").focus(); return; }
    if (!st.cart.length){ toast("Scan at least one set or piece."); scan.focus(); return; }
    var unticked = st.order.items.filter(function(i){ return !st.ticks[key(i.design,i.variant)]; });
    var short = st.order.items.filter(function(i){ return gathered(i.design,i.variant) < i.qty; });
    var lines = X.aggregate(st.cart), pcs = sum(lines, function(l){ return l.pcs; }), amt = sum(lines, function(l){ return l.amount; });
    var extras = lines.filter(function(l){ return !st.order.items.some(function(i){ return i.design===l.design && i.variant===l.variant; }); });
    party.commit(function(pid, snap){
      var warn = [];
      if (short.length) warn.push("<li><b>"+short.length+"</b> order line"+(short.length>1?"s are":" is")+" not fully picked ("+short.map(function(i){ return esc(i.design)+" "+esc(vName(i.design,i.variant)); }).join(", ")+").</li>");
      if (unticked.length) warn.push("<li><b>"+unticked.length+"</b> checklist line"+(unticked.length>1?"s aren't":" isn't")+" ticked.</li>");
      if (extras.length) warn.push("<li><b>"+extras.length+"</b> variant"+(extras.length>1?"s":"")+" not on the order form will be billed as extras.</li>");
      modal(editing ? "Save changes to "+esc(norm($("#iNo").value))+"?" : "Generate invoice "+esc(norm($("#iNo").value))+"?",
        "<b>"+pcs+" pieces</b> across "+lines.length+" variant"+(lines.length>1?"s":"")+" &middot; <b>"+inr(amt)+"</b> for <b>"+esc(snap.name)+"</b>.<br>"+
        (editing ? "Stock will be adjusted to match the updated invoice." : "These pieces will be deducted from stock.")+
        (warn.length ? '<ul style="margin:10px 0 0;padding-left:18px;color:#92400E;">'+warn.join("")+'</ul>' : ""),
        [{label:"Back to picking"},{label: editing ? "Save changes" : "Generate Invoice", kind:"pri", fn:function(){ finish(pid, snap); }}]);
    });
  }

  function finish(pid, snap){
    var no = norm($("#iNo").value);
    var rec = { no:no, date:$("#iDate").value.trim() || X.todayStr(), orderNo:st.order.no, partyId:pid, party:snap,
      entries:st.cart.map(function(e){ return {scanId:e.scanId, kind:e.kind, design:e.design, variant:e.variant, pieces:e.pieces.slice(), method:e.method, time:e.time}; }),
      ticks:JSON.parse(JSON.stringify(st.ticks)), by: editing ? editing.by : (isOwner()?"Owner":"Staff"),
      editedBy: editing ? "Owner" : null, updated:X.todayStr() };
    if (editing){
      // pieces taken off the invoice return to stock (they're already unsold); keep scanned ones sold
      leaveHook = null;
      rec.entries.forEach(function(e){ e.pieces.forEach(function(p){ PIECES[p].sold = no; }); });
      INVOICES[INVOICES.indexOf(editing)] = rec;
      st.order.invoiceNo = no;
      toast("Invoice "+no+" updated and stock adjusted.");
    } else {
      rec.entries.forEach(function(e){ e.pieces.forEach(function(p){ PIECES[p].sold = no; }); });
      INVOICES.push(rec);
      st.order.status = "invoiced"; st.order.invoiceNo = no;
      toast("Invoice "+no+" generated \u2014 "+sum(rec.entries,function(e){return e.pieces.length;})+" pcs deducted from stock.");
    }
    go("invoiceView", {no:no});
  }

  if (editing) load(st.order);
  else if (presetOrder){ ordInp.value = presetOrder; fetchOrder(); }
  else { body(); setTimeout(function(){ $("#iNo").focus(); }, 0); }
}

/* =====================================================================
   INVOICE — VIEW + HISTORY
   ===================================================================== */
function viewInvoiceDoc(no){
  var inv = X.invoiceByNo(no); if (!inv) return go("invoices");
  var t = X.invoiceTotals(inv);
  $("#app").innerHTML = subnav() +
    '<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">'+
      '<div><button class="fclear" id="vBack" style="padding-left:0;">'+icon("back",13,2)+' Invoices</button>'+
      '<h1 style="margin-top:2px;">'+esc(inv.no)+'</h1><p class="sub">'+esc(inv.party.name)+' &middot; '+esc(X.longDate(inv.date))+' &middot; '+t.pcs+' pcs &middot; <b style="color:var(--ink);">'+inr(t.amount)+'</b></p></div>'+
      '<div class="acts" style="flex-wrap:wrap;align-items:center;">'+
        '<button class="btn" id="vPrint">'+icon("print",14,2)+'Print</button>'+
        '<button class="btn" id="vCsv">'+icon("download",14,2)+'Download (Excel)</button>'+
        '<button class="btn" id="vPhotos">'+icon("image",14,2)+'Photos</button>'+
        '<button class="btn" id="vOrd">'+icon("doc",14,2)+esc(inv.orderNo)+'</button>'+
        (isOwner() ? '<button class="btn pri" id="vEdit">'+icon("pencil",14,2)+'Edit invoice</button>'
          : '<button class="btn" disabled title="Only the owner can edit invoices">'+icon("lock",14,2)+'Edit (owner only)</button>')+
      '</div></div></div>'+
    '<div class="sheet"><div class="docwrap">'+invoiceDocHtml(inv)+'</div></div>';
  $("#vBack").onclick = function(){ go("invoices"); };
  $("#vPrint").onclick = function(){ openPrint("Invoice "+inv.no+" \u2014 print preview", invoiceDocHtml(inv)); };
  $("#vCsv").onclick = function(){ invoiceCSV(inv); toast("Downloaded "+inv.no+".csv"); };
  $("#vPhotos").onclick = function(){ window.__GALLERY.reset(); go("gallery", {mode:"invoice", no:inv.no}); };
  $("#vOrd").onclick = function(){ go("orderView", {no:inv.orderNo}); };
  if ($("#vEdit")) $("#vEdit").onclick = function(){ go("invoiceEdit", {no:inv.no}); };
}

var IF = { q:"" };
function viewInvoices(){
  $("#app").innerHTML = subnav() +
    head("Invoices", "Every dispatch billed and deducted from stock. Only the owner can edit an invoice.",
      '<button class="btn pri" id="newI">'+icon("plus",15,2.2)+'New Invoice</button>') +
    '<div class="sheet"><div class="hsearch"><span class="mag">'+icon("search",19,2)+'</span>'+
      '<input id="iq" autocomplete="off" placeholder="Search by invoice no., order form no., party or design code"></div>'+
      '<div class="filters"><span class="rcount" id="irc"></span></div>'+
      '<div class="gt" style="margin-top:6px;"><div class="gh" style="grid-template-columns:1.1fr .8fr .9fr 1.4fr 1.8fr .6fr .9fr 200px;">'+
      '<span>Invoice</span><span>Date</span><span>Order form</span><span>Party</span><span>Designs &middot; variants</span><span>Pcs</span><span>Amount</span><span></span></div>'+
      '<div id="ilist"></div></div></div>';
  $("#iq").value = IF.q;
  $("#newI").onclick = function(){ go("invoiceEdit"); };
  $("#iq").addEventListener("input", function(){ IF.q = this.value; list(); });
  function list(){
    var q = IF.q.trim().toLowerCase();
    var rows = INVOICES.filter(function(i){ if (!q) return true;
      return [i.no, i.orderNo, i.party.name, i.party.mobile].concat(i.entries.map(function(e){ return e.design+" "+vName(e.design,e.variant); })).join(" ").toLowerCase().indexOf(q) >= 0;
    }).slice().reverse();
    $("#irc").textContent = rows.length+" of "+INVOICES.length+" invoices";
    $("#ilist").innerHTML = rows.map(function(i){ var t = X.invoiceTotals(i);
      return '<div class="gr" style="grid-template-columns:1.1fr .8fr .9fr 1.4fr 1.8fr .6fr .9fr 200px;">'+
        '<span class="b1">'+esc(i.no)+'</span><span style="color:var(--mut);">'+esc(i.date)+'</span><span class="mono" style="font-size:12.3px;">'+esc(i.orderNo)+'</span>'+
        '<div>'+esc(i.party.name)+'<div class="b2">'+esc(i.party.city)+'</div></div>'+
        '<div class="chips">'+t.lines.map(function(l){ return chip(l.design, l.variant); }).join("")+'</div>'+
        '<span class="num">'+t.pcs+'</span><span class="num" style="font-weight:700;">'+inr(t.amount)+'</span>'+
        '<div class="acts"><button class="btn sm" data-iv="'+esc(i.no)+'">'+icon("eye",13,2)+'View</button>'+
        (isOwner() ? '<button class="btn sm" data-ie="'+esc(i.no)+'">'+icon("pencil",13,2)+'Edit</button>'
                   : '<button class="btn sm" disabled title="Only the owner can edit invoices">'+icon("lock",13,2)+'</button>')+'</div></div>';
    }).join("") || '<div class="empty"><b>No invoices match</b>Try another search.</div>';
    $all("[data-iv]", $("#ilist")).forEach(function(b){ b.onclick = function(){ go("invoiceView", {no:b.dataset.iv}); }; });
    $all("[data-ie]", $("#ilist")).forEach(function(b){ b.onclick = function(){ go("invoiceEdit", {no:b.dataset.ie}); }; });
  }
  list();
}

/* =====================================================================
   PARTY MASTER
   ===================================================================== */
var PF = { q:"" };
function viewParties(){
  $("#app").innerHTML = subnav() +
    head("Party Master", "Saved customers. Order forms and invoices fill from here, and can save changes back when you choose.",
      '<button class="btn pri" id="newP">'+icon("plus",15,2.2)+'Add party</button>') +
    '<div class="sheet"><div class="hsearch"><span class="mag">'+icon("search",19,2)+'</span>'+
      '<input id="pq" autocomplete="off" placeholder="Search by party name, mobile, city or GST no."></div>'+
      '<div class="filters"><span class="rcount" id="prc"></span></div>'+
      '<div class="gt" style="margin-top:6px;"><div class="gh" style="grid-template-columns:1.5fr 1fr .8fr 1.3fr 1.3fr 1fr .8fr 80px;">'+
      '<span>Party</span><span>Mobile</span><span>City</span><span>GST No.</span><span>Transport</span><span>Agent</span><span>Orders</span><span></span></div>'+
      '<div id="plist"></div></div></div>';
  $("#pq").value = PF.q;
  $("#pq").addEventListener("input", function(){ PF.q = this.value; list(); });
  $("#newP").onclick = function(){ partyForm(null); };
  function list(){
    var q = PF.q.trim().toLowerCase();
    var rows = PARTIES.filter(function(p){ return !q || [p.name,p.mobile,p.city,p.gst].join(" ").toLowerCase().indexOf(q) >= 0; });
    $("#prc").textContent = rows.length+" of "+PARTIES.length+" parties";
    $("#plist").innerHTML = rows.map(function(p){
      var n = ORDERS.filter(function(o){ return o.partyId===p.id; }).length;
      return '<div class="gr" style="grid-template-columns:1.5fr 1fr .8fr 1.3fr 1.3fr 1fr .8fr 80px;">'+
        '<b>'+esc(p.name)+'</b><span class="mono" style="font-size:12.3px;">'+esc(p.mobile)+'</span><span>'+esc(p.city)+'</span>'+
        '<span class="mono" style="font-size:12px;">'+esc(p.gst)+'</span><span style="color:var(--ink-2);">'+esc(p.transport)+'</span><span>'+esc(p.agent)+'</span>'+
        '<span class="num">'+n+'</span><div style="text-align:right;"><button class="btn sm" data-pe="'+p.id+'">'+icon("pencil",13,2)+'Edit</button></div></div>';
    }).join("") || '<div class="empty"><b>No parties match</b></div>';
    $all("[data-pe]", $("#plist")).forEach(function(b){ b.onclick = function(){ partyForm(b.dataset.pe); }; });
  }
  function partyForm(id){
    var p = id ? X.partyById(id) : null;
    modal(p ? "Edit party" : "Add party",
      '<div class="grid2" style="gap:12px 14px;">'+X.PARTY_FIELDS.map(function(f){
        return '<div class="field"><label>'+f[1]+(f[0]==="name"?' <span class="req">*</span>':'')+'</label><input class="inp" id="pf_'+f[0]+'" value="'+esc(p?p[f[0]]:"")+'"></div>'; }).join("")+'</div>',
      [{label:"Cancel"},{label: p ? "Save party" : "Add party", kind:"pri", fn:function(){
        var name = $("#pf_name").value.trim();
        if (!name){ toast("Party name is required."); return partyForm(id); }
        var dupe = PARTIES.filter(function(x){ return norm(x.name)===norm(name) && x.id!==id; })[0];
        if (dupe){ toast(name+" already exists in Party Master."); return partyForm(id); }
        var rec = p || {id:X.newPartyId()};
        X.PARTY_FIELDS.forEach(function(f){ rec[f[0]] = $("#pf_"+f[0]).value.trim(); });
        if (!p) PARTIES.push(rec);
        toast(p ? "Party updated." : name+" added to Party Master."); list();
      }}]);
    setTimeout(function(){ var f = $("#pf_name"); if (f) f.focus(); }, 0);
  }
  list();
}

/* global keys */
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if ($("#pmodal").classList.contains("on")) $("#pmodal").classList.remove("on");
  else if ($("#mwrap").classList.contains("on")) X.closeModal();
});
$("#mwrap").addEventListener("click", function(e){ if (e.target === this) X.closeModal(); });

window.__SOAPP = { go:go, S:S };
render();
})();
